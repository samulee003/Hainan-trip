# 這個站是純靜態 HTML/CSS/JS，沒有任何建置步驟。
# 之前的版本把整個網站塞進 site.b64.* 分塊、在 build 時解壓，
# 只要有一個分塊寫壞整個部署就會失敗（而且真的發生過），所以改成直接發布 repo 根目錄。
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# HTML 每次都重新驗證，行程改了就會馬上看到。
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/site.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# 舊版曾經用 itinerary.part*.txt 由前端拼裝頁面，這些檔案已經不存在了。
[[redirects]]
  from = "/itinerary.part*"
  to = "/itinerary.html"
  status = 301
