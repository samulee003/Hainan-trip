# 這個站是純靜態 HTML/CSS/JS，沒有任何建置步驟。
# 之前的版本把整個網站塞進 site.b64.* 分塊、在 build 時解壓，
# 只要有一個分塊寫壞整個部署就會失敗（而且真的發生過），所以改成直接發布 repo 根目錄。
#
# command 一定要明確寫出來：netlify.toml 沒寫的欄位會退回 Netlify UI 上的設定，
# 而 UI 那邊還留著舊的 `cat site.b64.* | base64 -d` 指令——分塊檔已經刪掉，那行必定失敗。
[build]
  command = "echo 'Static site, nothing to build.'"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# HTML 每次都重新驗證，行程改了就會馬上看到。
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/itinerary.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/practical-guide.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/site.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
